name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The compiled frontend is committed, so that the plugin can be installed
      # straight from git. Fail if it does not match the frontend source.
      - name: Check the committed frontend build is up to date
        run: |
          if [ -n "$(git status --porcelain -- inventree_workshop/static)" ]; then
            git status --short -- inventree_workshop/static
            echo "::error::inventree_workshop/static is out of date. Run 'npm ci && npm run build' in frontend/ and commit the result."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The rules are plain Python, so they are tested without InvenTree
      - name: Test the rules
        run: |
          python -m pip install --upgrade pytest
          python -m pytest tests

      - name: Build the Python package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel contains the compiled frontend
        run: python -m zipfile -l dist/*.whl | grep -q "inventree_workshop/static/Workshop.js"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
