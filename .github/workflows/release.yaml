name: Release

# Runs when a version tag (e.g. v0.2.0) is pushed.
# Builds the plugin and attaches the wheel to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the tag matches the plugin version
        run: |
          version=$(python -c "import re; print(re.search(r\"PLUGIN_VERSION = '([^']+)'\", open('inventree_workshop/__init__.py').read()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match PLUGIN_VERSION ${version} in inventree_workshop/__init__.py"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the Python package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel contains the compiled frontend
        run: python -m zipfile -l dist/*.whl | grep -q "inventree_workshop/static/Workshop.js"

      # If the release was already created by hand (e.g. "Draft a new release"
      # in the GitHub web interface), just attach the built files to it.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Optional: also publish to PyPI, using trusted publishing (no API token).
  # To enable it, add this repository as a trusted publisher for the
  # 'inventree-workshop' project on PyPI (workflow 'release.yaml',
  # environment 'pypi'), then create a repository variable
  # PUBLISH_TO_PYPI with the value 'true'.
  pypi:
    name: Publish to PyPI
    needs: release
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
